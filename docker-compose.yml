services:
  backend:
    build: . 
    container_name: hustcord-backend 
    restart: unless-stopped1

    ports:
      - "${PORT}:${PORT}"
    environment:
      PORT: ${PORT} 
      JWT_SECRET: ${JWT_SECRET} 
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET} 
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN} 
      MONGO_URI: ${MONGO_URI} 
      DB_HOST: ${DB_HOST} 
      DB_PORT: ${DB_PORT} 
      DB_USERNAME: ${DB_USERNAME} 
      DB_PASSWORD: ${DB_PASSWORD} 
      DB_NAME: ${DB_NAME}

      # docker compose up -d