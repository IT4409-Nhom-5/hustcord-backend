name: Hustcord Backend CI/CD Docker
on: 
  push: 
    branches:
      - master
jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
    # Lay source code tu github
      - name: Checkout source code
        uses: actions/checkout@v4
      
      # Chuan bi moi truong build Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Dag nhap 
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      # 4. build docker image va push len DockerHub, luu y trong tags: co dang dockerhub-username/image-name:tag
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context:
          file: Dockerfile
          push: true
          tags: hustcord/backend:latest
    
    
